server:
  port: 8080
  forward-headers-strategy: framework
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,application/javascript,application/openapi+json,application/vnd.api+json
    min-response-size: 2048
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000
    max-connections: 10000
    accept-count: 200

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: support-backend   # ✅ Changed from support-service
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:true}
    allow-bean-definition-overriding: true
  messages:
    encoding: UTF-8
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql-support:5432/fitnest_support}
    username: ${SPRING_DATASOURCE_USERNAME:fitnest_support}
    password: ${SPRING_DATASOURCE_PASSWORD:support_password_123}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: HikariCP-Support
      maximum-pool-size: ${HIKARI_MAX_POOL:15}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      leak-detection-threshold: 30000
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keep-alive-time: 300000
      auto-commit: false
      data-source-properties:
        reWriteBatchedInserts: true
        prepareThreshold: 5
        preparedStatementCacheQueries: 250
        preparedStatementCacheSizeMiB: 10
        tcpKeepAlive: true
        binaryTransfer: true
        socketTimeout: 30
        connectTimeout: 10
        loginTimeout: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false
        connection:
          provider_disables_autocommit: true
  jackson:
    default-property-inclusion: NON_NULL
    time-zone: UTC

  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms

      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2
          max-wait: 2000ms
        shutdown-timeout: 100ms
  # Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-service:9092}
    consumer:
      group-id: support-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  cloud:
    openfeign:
      httpclient:
        hc5:
          enabled: true
          pool:
            max-connections: ${FEIGN_MAX_CONNECTIONS:50}
            max-connections-per-route: ${FEIGN_CONNECTIONS_PER_ROUTE:20}
            conn-pool-policy: LIFO
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT:5000}
            read-timeout: ${FEIGN_READ_TIMEOUT:10000}
            connectTimeout: 5000
            readTimeout: 5000
            loggerLevel: BASIC

eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRET:your-jwt-secret-change-in-production}
  issuer: ${JWT_ISSUER:fitnest}

# ✅ Updated service URLs
iam:
  backend:
    url: ${IDENTITY_BACKEND_URL:http://identity-backend:8080}

user:
  backend:
    url: ${USER_BACKEND_URL:http://user-backend:8080}

media:
  backend:
    url: ${STORAGE_BACKEND_URL:http://storage-backend:8080}

app:
  security:
    internal-token: ${APP_SECURITY_INTERNAL_TOKEN:fitnest-internal-token-2024-secure-v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

springdoc:
  server-url: ${SPRINGDOC_SERVER_URL:https://api.fitnest.az}
  api-docs:
    path: /v3/api-docs
    cache:
      enabled: true
    pre-loading-enabled: true
  paths-to-exclude: /api/v1/internal/**
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    doc-expansion: none
    filter: true
    display-request-duration: true
    try-it-out-enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: false

grpc:
  client:
    # ✅ Updated gRPC client from user-service to user-backend
    user-backend:
      address: ${USER_BACKEND_GRPC_ADDRESS:dns:///user-backend:9090}
      negotiation-type: plaintext

logging:
  level:
    root: WARN
    org.springframework: WARN
    az.fitnest: WARN
  file:
    name: logs/support-backend.log   # ✅ Optional: updated log file name